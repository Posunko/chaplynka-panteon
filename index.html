<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пантеон Героїв Чаплинщини</title>
    <style>
        /* Основні стилі та змінні */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --accent-gold: #d4af37;
            --accent-hover: #f1c40f;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Шапка сайту */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(18,18,18,1) 100%);
            border-bottom: 2px solid var(--accent-gold);
            padding: 2.5rem 1rem;
            text-align: center;
        }

        .header-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .symbol {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Пошук та фільтри */
        .search-section {
            max-width: 1200px;
            margin: 2rem auto 1rem;
            padding: 0 1rem;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 0.8rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
        }

        /* Сітка карток */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        /* Картка Героя */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .card-img-wrapper {
            width: 100%;
            height: 320px;
            background-color: #2a2a2a;
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: filter 0.3s;
        }

        .card:hover .card-img {
            filter: grayscale(0%);
        }

        /* Жалобна стрічка на фото */
        .ribbon {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 18px;
            height: 36px;
            background-color: #000;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        .card-content {
            padding: 1.2rem;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.3rem;
        }

        .hero-rank {
            color: var(--accent-gold);
            font-size: 0.9rem;
            margin-bottom: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .hero-dates {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        .btn-more {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s, color 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-more:hover {
            background: var(--accent-gold);
            color: #000;
        }

        /* Підвал */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
            background: #0a0a0a;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-container">
            <div class="symbol">🕯️</div>
            <h1>Пантеон Героїв Чаплинщини</h1>
            <p class="subtitle">Книга пам'яті та
