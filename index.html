<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пантеон Чаплинського краю — Меморіал Героїв</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.15) 0%, rgba(14, 10, 7, 0.98) 75%);
        }

        /* Шапка */
        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        /* Анімація пульсації свічки */
        @keyframes candlePulse {
            0% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
            50% {
                box-shadow: 0 0 18px rgba(229, 190, 100, 0.7), inset 0 0 10px rgba(229, 190, 100, 0.4);
                border-color: #ffdf8c;
            }
            100% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
        }

        /* Головний банер */
        .hero-banner {
            max-width: 900px;
            margin: 3.5rem auto 2.5rem;
            padding: 0 1.5rem;
            text-align: center;
        }

        /* Пульсація плашки */
        .memorial-badge {
            display: inline-block;
            padding: 0.5rem 1.4rem;
            border: 2px solid var(--accent-gold);
            border-radius: 30px;
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.8rem;
            background: rgba(229, 190, 100, 0.1);
            animation: candlePulse 2.5s infinite ease-in-out;
        }

        /* Шовкова жовто-блакитна стрічка, що розвівається */
        .ribbon-wrapper {
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            height: 28px;
            overflow: hidden;
            margin-top: 1.2rem;
            margin-bottom: 1rem;
        }

        .waving-ribbon {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, 
                #0057b7 0%, #0057b7 48%, 
                #ffd700 52%, #ffd700 100%);
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 12px rgba(229, 190, 100, 0.2);
            animation: waveRibbon 4s infinite ease-in-out;
            transform-origin: center;
        }

        @keyframes waveRibbon {
            0% {
                clip-path: polygon(0 20%, 25% 0%, 50% 25%, 75% 5%, 100% 20%, 100% 80%, 75% 95%, 50% 75%, 25% 100%, 0 80%);
            }
            50% {
                clip-path: polygon(0 5%, 25% 25%, 50% 0%, 75% 20%, 100% 5%, 100% 95%, 75% 75%, 50% 100%, 25% 80%, 0 95%);
            }
            100% {
                clip-path: polygon(0 20%, 25% 0%, 50% 25%, 75% 5%, 100% 20%, 100% 80%, 75% 95%, 50% 75%, 25% 100%, 0 80%);
            }
        }

        /* Свічка під стрічкою */
        .ribbon-candle {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
            margin-top: 0.5rem;
        }

        .candle-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(229,
