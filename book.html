<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга пам'яті — Пантеон Чаплинського краю</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.12) 0%, rgba(14, 10, 7, 0.95) 70%);
        }

        /* Шапка */
        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(229, 190, 100, 0.2);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            animation: candlePulse 2.5s infinite ease-in-out;
        }

        @keyframes candlePulse {
            0% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
            50% {
                box-shadow: 0 0 18px rgba(229, 190, 100, 0.7), inset 0 0 10px rgba(229, 190, 100, 0.4);
                border-color: #ffdf8c;
            }
            100% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .btn-header {
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-header:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        /* Заголовок сторінки */
        .page-header {
            text-align: center;
            padding: 3rem 1.5rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--text-primary);
            margin-bottom: 1.2rem;
            word-wrap: break-word;
        }

        /* Сповільнений анімований вірш */
        .poem-container {
            font-style: italic;
            max-width: 650px;
            margin: 0 auto 2.5rem;
            line-height: 1.8;
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .poem-line {
            display: block;
            opacity: 0;
            transform: translateY(12px);
            animation: floatUpLine 2s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        .poem-line:nth-child(1) { animation-delay: 0.4s; }
        .poem-line:nth-child(2) { animation-delay: 0.9s; }
        .poem-line:nth-child(3) { animation-delay: 1.4s; }
        .poem-line:nth-child(4) { animation-delay: 1.9s; }
        .poem-line:nth-child(5) { animation-delay: 2.4s; }
        .poem-line:nth-child(6) { animation-delay: 2.9s; }
        .poem-line:nth-child(7) { animation-delay: 3.4s; }
        .poem-line:nth-child(8) { animation-delay: 3.9s; }
        .poem-author { animation-delay: 4.4s; }

        @keyframes floatUpLine {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alive-word {
            color: var(--accent-gold);
            font-weight: 700;
            font-style: normal;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(229, 190, 100, 0.4);
        }

        .poem-author {
            display: block;
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-style: normal;
            opacity: 0;
            transform: translateY(10px);
            animation: floatUpLine 2s forwards cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Блок фільтрів та пошуку */
        .controls-section {
            max-width: 1100px;
            margin: 0 auto 2.5rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(229, 190, 100, 0.2);
        }

        .filter-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.5rem 1.1rem;
            background: rgba(24, 18, 14, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(229, 190, 100, 0.1);
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
            flex: 1;
            width: 100%;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        .hero-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
            height: auto;
        }

        .hero-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .card-img-container {
            width: 100%;
            height: 330px;
            position: relative;
            background-color: #120e0a;
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            filter: grayscale(20%);
            transition: filter 0.3s, transform 0.3s;
        }

        .hero-card:hover .hero-img {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        .mourning-ribbon {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(14, 10, 7, 0.85);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        .card-body {
            padding: 1.3rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            text-align: center;
        }

        .hero-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .hero-rank {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .hero-hromada {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
        }

        .hero-dates {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 0.6rem;
        }

        .btn-card {
            display: inline-block;
            padding: 0.55rem 1rem;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-card:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(14, 10, 7, 0.95);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            header {
