<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга пам'яті — Пантеон Чаплинського краю</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.12) 0%, rgba(14, 10, 7, 0.95) 70%);
        }

        /* Шапка */
        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(229, 190, 100, 0.2);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .btn-header {
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-header:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        /* Заголовок сторінки та Пошук */
        .page-header {
            text-align: center;
            padding: 3rem 1.5rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            margin-bottom: 2rem;
        }

        /* Блок фільтрів та пошуку */
        .controls-section {
            max-width: 1100px;
            margin: 0 auto 2.5rem;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 12px rgba(229, 190, 100, 0.2);
        }

        /* Кнопки фільтрів за громадами */
        .filter-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.5rem 1.1rem;
            background: rgba(24, 18, 14, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(229, 190, 100, 0.1);
        }

        /* Сітка карток */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
            flex: 1;
            width: 100%;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem;
        }

        /* Картка Героя */
        .hero-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .hero-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .card-img-container {
            width: 100%;
            height: 330px;
            position: relative;
            background-color: #120e0a;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(25%);
            transition: filter 0.3s;
        }

        .hero-card:hover .hero-img {
            filter: grayscale(0%);
        }

        /* Спеціальна плашка для Вартових неба / Захисників краю */
        .hero-badge-sky {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(14, 10, 7, 0.9);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        /* Пам'ятна кругла плашка зі свічкою */
        .mourning-ribbon {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: rgba(14, 10, 7, 0.85);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
