<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заторський Руслан Олександрович — Пантеон Чаплинського краю</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.12) 0%, rgba(14, 10, 7, 0.95) 70%);
        }

        /* Шапка */
        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(229, 190, 100, 0.2);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
            animation: candlePulse 2.5s infinite ease-in-out;
        }

        @keyframes candlePulse {
            0% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
            50% {
                box-shadow: 0 0 18px rgba(229, 190, 100, 0.7), inset 0 0 10px rgba(229, 190, 100, 0.4);
                border-color: #ffdf8c;
            }
            100% {
                box-shadow: 0 0 5px rgba(229, 190, 100, 0.3), inset 0 0 5px rgba(229, 190, 100, 0.2);
                border-color: var(--accent-gold);
            }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .btn-header {
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-header:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        /* Контейнер вмісту */
        .main-container {
            max-width: 900px;
            margin: 2rem auto 4rem;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: var(--accent-gold-hover);
        }

        .hero-profile {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-header {
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 2rem;
        }

        .profile-img-box {
            width: 280px;
            height: 360px;
            flex-shrink: 0;
            position: relative;
            background-color: #120e0a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .profile-img {
            width: 100%;
            height
