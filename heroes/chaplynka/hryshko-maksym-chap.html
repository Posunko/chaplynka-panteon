<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гришко Максим Сергійович — Чаплинка Пантеон</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.1) 0%, rgba(14, 10, 7, 0.95) 70%);
        }

        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(229, 190, 100, 0.2);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .btn-header {
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-header:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        .hero-container {
            max-width: 1000px;
            margin: 2.5rem auto 4rem;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--accent-gold);
        }

        .hero-profile-header {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-img-box {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background-color: #120e0a;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .mourning-ribbon {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 38px;
            height: 38px;
            background: rgba(14, 10, 7, 0.85);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-fullname {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--text-primary);
            line-height: 1.25;
            margin-bottom: 0.8rem;
        }

        .hero-badge-rank {
            display: inline-block;
            align-self: flex-start;
            padding: 0.3rem 1rem;
            background: rgba(229, 190, 100, 0.15);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }

        .info-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .info-item {
            display: flex
