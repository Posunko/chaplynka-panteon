<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подати інформацію про Героя — Чаплинка Пантеон</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0e0a07; 
            --card-bg: #18120e;
            --text-primary: #f5ebd9;
            --text-secondary: #c2b19b;
            --accent-gold: #e5be64; 
            --accent-gold-hover: #ffdf8c;
            --border-color: #382c21;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 20%, rgba(120, 85, 35, 0.12) 0%, rgba(14, 10, 7, 0.95) 70%);
        }

        /* Шапка */
        header {
            background-color: rgba(14, 10, 7, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(229, 190, 100, 0.2);
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .logo-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .logo-text span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--accent-gold);
        }

        .btn-header {
            padding: 0.6rem 1.4rem;
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-header:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        /* Заголовок сторінки */
        .page-header {
            text-align: center;
            padding: 3rem 1.5rem 1.5rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Контейнер для Google Форми */
        .form-container {
            max-width: 850px;
            margin: 0 auto 4rem;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .google-form-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 900px;
            border: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: rgba(14, 10, 7, 0.95);
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            nav { display: none; }
            header { padding: 1rem; }
            iframe { height: 1100px; }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <a href="index.html" class="logo-area">
            <div class="logo-icon">🕯️</div>
            <div class="logo-text">
                <h2>Чаплинка Пантеон</h2>
                <span>CHAPLYNKA-PANTEON.PP.UA</span>
            </div>
        </a>

        <nav>
            <a href="index.html">Головна</a>
            <a href="book.html">Книга пам'яті</a>
            <a href="about.html">Про проєкт</a>
            <a href="add-hero.html" class="active">Додати героя</a>
        </nav>

        <a href="add-hero.html" class="btn-header">Подати інформацію</a>
    </header>

    <!-- Заголовок -->
    <section class="page-header">
        <h1 class="page-title">Подати інформацію про Захисника</h1>
        <p class="page-subtitle">Заповніть форму нижче, щоб надіслати біографію та фотографію для збереження пам'яті про Героя в Пантеоні Чаплинського краю.</p>
    </section>

    <!-- Вбудована Google Форма -->
    <main class="form-container">
        <div class="google-form-wrapper">
            <!-- ВСТАВ СВОЄ ПОСИЛАННЯ НА GOOGLE ФОРМУ В АТРИБУТ src НИЖЧЕ -->
            <iframe src="https://forms.gle/JLPTyi3FrvekWX7t5">Завантаження форми...</iframe>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Олександр Посунько.</p>
    </footer>

</body>
</html>
